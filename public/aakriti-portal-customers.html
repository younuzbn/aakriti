<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aakriti — Customers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f0f2f5;
      --panel: #ffffff;
      --border: #e8e8ea;
      --text: #0a0a0a;
      --muted: #6b7280;
      --ui-blue: #2563eb;
      --ui-blue-soft: #eff6ff;
      --sidebar-w: 248px;
    }
    .filter-panel {
      background: linear-gradient(165deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 24px;
      box-shadow:
        0 1px 2px rgba(15, 23, 42, 0.04),
        0 4px 24px rgba(15, 23, 42, 0.04);
    }
    .filter-panel-title {
      margin: 0 0 16px;
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .filter-panel-inner--search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px 20px;
      align-items: end;
    }
    @media (max-width: 560px) {
      .filter-panel-inner--search { grid-template-columns: 1fr; }
    }
    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }
    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      letter-spacing: 0.01em;
    }
    .field-input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field-input::placeholder { color: #94a3b8; font-weight: 400; }
    .field-input:hover { border-color: #cbd5e1; }
    .field-input:focus {
      outline: none;
      border-color: var(--ui-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }
    .field-label--spacer {
      visibility: hidden;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
      min-height: 1.25em;
      user-select: none;
    }
    .btn-primary {
      height: 46px;
      padding: 0 24px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(37, 99, 235, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      white-space: nowrap;
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-outline {
      height: 40px;
      padding: 0 16px;
      border-radius: 11px;
      border: 1px solid #e2e8f0;
      background: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
    }
    .btn-outline:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
      color: var(--text);
    }
    .head-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: "DM Sans", Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    body.role-staff .admin-only { display: none !important; }
    body.role-admin .staff-only { display: none !important; }
    .topbar {
      min-height: 72px;
      padding: 12px 22px;
      background: #23292c;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-logo-link { display: flex; align-items: center; line-height: 0; text-decoration: none; }
    .brand-logo-img { height: 56px; width: auto; max-width: min(360px, 65vw); display: block; object-fit: contain; }
    .top-link {
      text-decoration: none;
      color: #f5f5f4;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      padding: 8px 14px;
      background: transparent;
      cursor: pointer;
      font: inherit;
    }
    .top-link:hover { border-color: rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.08); color: #fff; }
    .mobile-menu-btn {
      display: none;
      width: 40px; height: 40px;
      border: 1px solid rgba(255,255,255,0.26);
      background: transparent;
      border-radius: 10px;
      color: #f5f5f4;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
    }
    .mobile-menu-btn:hover { background: rgba(255,255,255,0.08); }
    .mobile-only { display: none !important; }
    .sidebar-backdrop {
      display: none;
      position: fixed;
      top: 72px; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      z-index: 40;
    }
    .sidebar-backdrop.is-open { display: block; }
    .app-wrap { flex: 1; display: flex; width: 100%; max-width: 1600px; margin: 0 auto; }
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 20px 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-brand {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 4px 10px 12px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      text-decoration: none;
      border: none;
      background: transparent;
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .nav-item:hover { background: #f3f4f6; color: var(--text); }
    .nav-item.active { background: var(--ui-blue-soft); color: var(--ui-blue); }
    .nav-item .ni { font-size: 16px; width: 22px; text-align: center; opacity: 0.9; }
    .nav-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      min-width: 22px;
      padding: 1px 7px;
      border-radius: 20px;
      background: #e5e7eb;
      color: #374151;
      font-size: 11px;
      font-weight: 800;
      transition: background 0.15s, color 0.15s;
    }
    .nav-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9ca3af; padding: 16px 10px 6px; }
    .sidebar-footer {
      margin-top: auto;
      padding: 16px 10px 4px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .sidebar-footer strong { display: block; color: var(--text); font-size: 13px; font-weight: 700; margin-top: 4px; word-break: break-word; }
    .app-main { flex: 1; min-width: 0; padding: 22px 20px 36px; }
    @media (min-width: 901px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 72px;
        width: var(--sidebar-w);
        height: calc(100vh - 72px);
        min-height: calc(100vh - 72px);
        overflow-y: auto;
        z-index: 25;
        box-shadow: 1px 0 0 var(--border);
      }
      .app-main { margin-left: var(--sidebar-w); }
    }
    @media (max-width: 900px) {
      .mobile-menu-btn { display: flex; }
      .sidebar {
        position: fixed;
        left: 0;
        top: 72px;
        height: calc(100dvh - 72px);
        width: min(var(--sidebar-w), 85vw);
        transform: translateX(-110%);
        transition: transform 0.24s ease;
        z-index: 50;
        overflow-y: auto;
      }
      .sidebar.is-open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,0.15); }
      .app-main { margin-left: 0 !important; }
      .mobile-only { display: flex !important; }
      .topbar .top-link { display: none; }
    }
    .main-head h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 1.85rem); font-weight: 800; }
    .main-head p { margin: 0 0 20px; font-size: 15px; color: var(--muted); max-width: 40rem; line-height: 1.5; }
    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      overflow: hidden;
    }
    .card-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .card-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
    .card-body { padding: 0; }
    .table-wrap { overflow-x: auto; }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td { border-bottom: 1px solid var(--border); text-align: left; padding: 12px 14px; vertical-align: top; }
    th {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: #fafbfc;
    }
    tbody tr:hover { background: rgba(37, 99, 235, 0.04); }
    .td-num { font-variant-numeric: tabular-nums; font-weight: 600; }
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
    .err { padding: 14px; border-radius: 12px; background: #fef2f2; color: #991b1b; font-size: 14px; display: none; margin-bottom: 16px; }
    .row-actions { display: flex; gap: 6px; }
    .btn-row-edit {
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
    }
    .btn-row-edit:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
    .btn-row-del {
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid #fecaca;
      background: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      color: #dc2626;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-row-del:hover { background: #fef2f2; border-color: #dc2626; }
    .btn-row-del.confirming { background: #dc2626; color: #fff; border-color: #dc2626; }
    /* Edit modal */
    .edit-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .edit-backdrop.open { display: flex; }
    .edit-panel {
      background: #fff;
      border-radius: 18px;
      padding: 28px 26px 22px;
      width: min(420px, 92vw);
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    }
    .edit-panel h3 { margin: 0 0 6px; font-size: 17px; font-weight: 800; }
    .edit-panel .edit-sub { margin: 0 0 20px; font-size: 13px; color: var(--muted); }
    .edit-field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
    .edit-field label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .edit-field input {
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 11px;
      padding: 11px 13px;
      font: inherit;
      font-size: 15px;
    }
    .edit-field input:focus { outline: none; border-color: var(--ui-blue); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    .edit-actions { display: flex; gap: 8px; margin-top: 6px; }
    .edit-actions .btn-primary { height: 42px; font-size: 14px; flex: 1; border-radius: 11px; }
    .edit-actions .btn-outline { height: 42px; font-size: 14px; border-radius: 11px; }
    .edit-err { display: none; font-size: 13px; color: #dc2626; margin-bottom: 10px; font-weight: 600; }
    /* Keep side-menu shell identical to dashboard */
    .sidebar-backdrop {
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .sidebar-backdrop.is-open { display: block; opacity: 1; visibility: visible; }
    @media (max-width: 900px) {
      .app-wrap { flex-direction: column; }
      .sidebar {
        top: 0;
        width: min(320px, 88vw);
        height: 100dvh;
        z-index: 100;
        box-shadow: 10px 0 30px rgba(15, 23, 42, 0.14);
        transform: translateX(-105%);
        transition: transform 0.2s ease;
        padding: 14px 12px 16px;
        overflow-x: hidden;
      }
      .sidebar.is-open { transform: translateX(0); }
      .app-main { padding: 18px 14px 30px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button type="button" class="mobile-menu-btn" id="btnOpenSideMenu" aria-label="Open menu">☰</button>
    <a class="brand-logo-link" href="/aakriti/dashboard" aria-label="Aakriti">
      <img class="brand-logo-img" src="/aakriti-logo.png" alt="Aakriti Boutique &amp; Makeup Studio" />
    </a>
    <button type="button" class="top-link" onclick="portalLogout()">Log out</button>
  </header>

  <div class="sidebar-backdrop" id="sideMenuBackdrop" aria-hidden="true"></div>

  <div class="app-wrap">
    <aside class="sidebar" id="sideMenu" aria-label="Main navigation">
      <div class="sidebar-brand">Salon</div>
      <a class="nav-item" href="/aakriti/dashboard"><span class="ni" aria-hidden="true">▣</span> Dashboard</a>
      <a class="nav-item" href="/aakriti/dashboard/today-bookings"><span class="ni" aria-hidden="true">☰</span> Today bookings</a>
      <button type="button" class="nav-item" onclick="location.href='/aakriti/dashboard'"><span class="ni" aria-hidden="true">＋</span> New booking</button>
      <div class="nav-label">Insights</div>
      <a class="nav-item" href="/aakriti/dashboard/analytics"><span class="ni" aria-hidden="true">▤</span> Month analytics</a>
      <a class="nav-item active" href="/aakriti/dashboard/customers"><span class="ni" aria-hidden="true">◎</span> Customers</a>
      <a class="nav-item" href="/aakriti/dashboard/reports"><span class="ni" aria-hidden="true">▦</span> Reports</a>
      <div class="nav-label">Queue filters</div>
      <button type="button" class="nav-item" onclick="location.href='/aakriti/dashboard'">
        <span class="ni" aria-hidden="true">♂</span> Gents
        <span class="nav-badge" aria-hidden="true"></span>
      </button>
      <button type="button" class="nav-item" onclick="location.href='/aakriti/dashboard'">
        <span class="ni" aria-hidden="true">♀</span> Ladies
        <span class="nav-badge" aria-hidden="true"></span>
      </button>
      <div class="nav-label admin-only">Management</div>
      <a class="nav-item admin-only" href="/aakriti/dashboard/stylists"><span class="ni" aria-hidden="true">✂</span> Stylists</a>
      <a class="nav-item admin-only" href="/aakriti/dashboard/staff"><span class="ni" aria-hidden="true">◉</span> Team &amp; staff</a>
      <button type="button" class="nav-item admin-only" onclick="location.href='/aakriti/dashboard'"><span class="ni" aria-hidden="true">⚙</span> Booking &amp; Time Settings</button>
      <div class="nav-label staff-only">Your shift</div>
      <div class="nav-item staff-only" style="cursor:default;background:#f9fafb;"><span class="ni" aria-hidden="true">✓</span> Queue access</div>
      <div class="sidebar-footer">
        Signed in as
        <strong id="sidebarUser">—</strong>
      </div>
      <button type="button" class="nav-item mobile-only" id="sideMenuLogout">
        <span class="ni" aria-hidden="true">↩</span> Log out
      </button>
    </aside>

    <div class="app-main">
      <header class="main-head">
        <h1>Customers</h1>
      </header>

      <div id="err" class="err"></div>

      <section class="filter-panel" aria-label="Search customers">
        <h2 class="filter-panel-title">Search</h2>
        <div class="filter-panel-inner--search">
          <div class="filter-field">
            <label class="field-label" for="customerSearch">Name or mobile</label>
            <input id="customerSearch" class="field-input" type="search" placeholder="Filter by name or phone number" autocomplete="off" />
          </div>
          <div class="filter-field filter-field--action">
            <span class="field-label field-label--spacer" aria-hidden="true">.</span>
            <button type="button" class="btn-primary" onclick="loadCustomers()">Search</button>
          </div>
        </div>
      </section>

      <div class="card">
        <div class="card-head">
          <h3>Customer list</h3>
          <div class="head-actions">
            <button type="button" class="btn-outline" onclick="exportCustomersPdf()">Save as PDF</button>
            <button type="button" class="btn-outline" onclick="exportCustomersExcel()">Save as Excel</button>
            <button type="button" class="btn-outline" onclick="exportCustomersDoc()">Save as Docs</button>
            <button type="button" class="btn-outline" onclick="clearCustomerSearch()">Clear &amp; reload</button>
          </div>
        </div>
        <div class="card-body">
          <div id="tableWrap" class="muted">Loading…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit customer modal -->
  <div id="editBackdrop" class="edit-backdrop" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="edit-panel">
      <h3 id="editTitle">Edit customer</h3>
      <p class="edit-sub" id="editSub">Update name for all bookings under this mobile.</p>
      <div class="edit-err" id="editErr"></div>
      <div class="edit-field">
        <label for="editName">Name</label>
        <input id="editName" type="text" autocomplete="off" placeholder="Customer name" />
      </div>
      <div class="edit-field">
        <label>Mobile</label>
        <input id="editMobileDisplay" type="text" readonly style="background:#f8f9fa;color:var(--muted);" />
      </div>
      <div class="edit-actions">
        <button type="button" class="btn-primary" onclick="saveEditCustomer()">Save changes</button>
        <button type="button" class="btn-outline" onclick="closeEditModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var q = new URLSearchParams(location.search);
      var st = q.get('setToken');
      var ret = q.get('returnLogin');
      if (st) {
        localStorage.setItem('aakritiPortalToken', st);
        if (ret) localStorage.setItem('aakritiPortalReturnLogin', ret);
        q.delete('setToken');
        q.delete('returnLogin');
        var qs = q.toString();
        history.replaceState({}, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
      }
    })();
    var API = '/api/aakriti/portal';
    function authHeaders() {
      var t = localStorage.getItem('aakritiPortalToken');
      return { 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' };
    }
    function portalLogout() {
      localStorage.removeItem('aakritiPortalToken');
      localStorage.removeItem('aakritiPortalRole');
      localStorage.removeItem('aakritiPortalUsername');
      var ret = localStorage.getItem('aakritiPortalReturnLogin');
      localStorage.removeItem('aakritiPortalReturnLogin');
      window.location.href = ret || '/aakriti/login';
    }
    async function api(path, opts) {
      var o = opts || {};
      var h = Object.assign({}, authHeaders(), o.headers || {});
      var res = await fetch(path, Object.assign({}, o, { headers: h }));
      var json = await res.json().catch(function(){ return {}; });
      if (res.status === 401) { portalLogout(); throw new Error('Session expired'); }
      if (!res.ok) throw new Error(json.message || 'Request failed');
      return json;
    }
    function applyRoleUI(role) {
      var isAdmin = role === 'admin';
      document.body.classList.toggle('role-admin', isAdmin);
      document.body.classList.toggle('role-staff', !isAdmin);
    }
    function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    var currentRole = 'staff';
    var currentCustomerRows = [];
    // Track delete-confirm state per mobile
    var deleteConfirming = {};
    var deleteTimers = {};

    function clearCustomerSearch() {
      var el = document.getElementById('customerSearch');
      if (el) el.value = '';
      loadCustomers();
    }
    function customersListUrl() {
      var el = document.getElementById('customerSearch');
      var search = el ? String(el.value || '').trim() : '';
      if (!search) return API + '/customers';
      return API + '/customers?search=' + encodeURIComponent(search);
    }
    async function loadCustomers() {
      var errEl = document.getElementById('err');
      errEl.style.display = 'none';
      var tw = document.getElementById('tableWrap');
      try {
        var data = await api(customersListUrl());
        var rows = (data.data && data.data.customers) || [];
        currentCustomerRows = rows.slice();
        var q = document.getElementById('customerSearch');
        var hasSearch = q && String(q.value || '').trim().length >= 1;
        if (!rows.length) {
          tw.innerHTML =
            '<div class="empty">' +
            (hasSearch ? 'No customers match this search.' : 'No customer records yet.') +
            '</div>';
          return;
        }
        var isAdmin = currentRole === 'admin';
        var actionsHeader = isAdmin ? '<th>Actions</th>' : '';
        tw.innerHTML =
          '<div class="table-wrap"><table class="data-table"><thead><tr>' +
          '<th>Name</th><th>Mobile</th><th>Visits</th><th>First visit</th><th>Last visit</th>' + actionsHeader +
          '</tr></thead><tbody>' +
          rows.map(function(r) {
            var actions = '';
            if (isAdmin) {
              var mobileEnc = esc(r.mobile || '');
              actions = '<td><div class="row-actions">' +
                '<button type="button" class="btn-row-edit" data-mobile="' + mobileEnc + '" data-name="' + esc(r.name || '') + '" onclick="openEditModal(this)">Edit</button>' +
                '<button type="button" class="btn-row-del" id="del-' + mobileEnc + '" data-mobile="' + mobileEnc + '" onclick="deleteCustomer(this)">Delete</button>' +
                '</div></td>';
            }
            return '<tr>' +
              '<td>' + esc(r.name || '') + '</td>' +
              '<td>' + esc(r.mobile || '') + '</td>' +
              '<td class="td-num">' + Number(r.bookingCount || 0) + '</td>' +
              '<td>' + (r.firstVisit ? new Date(r.firstVisit).toLocaleDateString() : '—') + '</td>' +
              '<td>' + (r.lastVisit ? new Date(r.lastVisit).toLocaleDateString() : '—') + '</td>' +
              actions +
              '</tr>';
          }).join('') +
          '</tbody></table></div>';
      } catch (e) {
        errEl.textContent = e.message || 'Failed to load';
        errEl.style.display = 'block';
        tw.innerHTML = '<div class="empty">Could not load customers.</div>';
      }
    }
    function downloadBlob(filename, type, content) {
      var blob = new Blob([content], { type: type });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function() { URL.revokeObjectURL(url); a.remove(); }, 0);
    }
    function csvEscape(v) {
      var s = v == null ? '' : String(v);
      if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }
    function exportCustomersExcel() {
      var rows = currentCustomerRows || [];
      if (!rows.length) { alert('No customer data to export.'); return; }
      var lines = ['Name,Mobile,Visits,First Visit,Last Visit'];
      rows.forEach(function(r) {
        lines.push([
          csvEscape(r.name || ''),
          csvEscape(r.mobile || ''),
          csvEscape(Number(r.bookingCount || 0)),
          csvEscape(r.firstVisit ? new Date(r.firstVisit).toLocaleDateString() : ''),
          csvEscape(r.lastVisit ? new Date(r.lastVisit).toLocaleDateString() : '')
        ].join(','));
      });
      downloadBlob('customers_report.csv', 'text/csv;charset=utf-8', lines.join('\n'));
    }
    function exportCustomersDoc() {
      var rows = currentCustomerRows || [];
      if (!rows.length) { alert('No customer data to export.'); return; }
      var html =
        '<html><head><meta charset="utf-8"><title>Customers Report</title></head><body>' +
        '<h2>Customers Report</h2>' +
        '<table border="1" cellspacing="0" cellpadding="6"><tr><th>Name</th><th>Mobile</th><th>Visits</th><th>First Visit</th><th>Last Visit</th></tr>' +
        rows.map(function(r) {
          return '<tr><td>' + esc(r.name || '') + '</td><td>' + esc(r.mobile || '') + '</td><td>' + Number(r.bookingCount || 0) + '</td><td>' +
            (r.firstVisit ? new Date(r.firstVisit).toLocaleDateString() : '—') + '</td><td>' +
            (r.lastVisit ? new Date(r.lastVisit).toLocaleDateString() : '—') + '</td></tr>';
        }).join('') +
        '</table></body></html>';
      downloadBlob('customers_report.doc', 'application/msword', html);
    }
    function exportCustomersPdf() {
      var rows = currentCustomerRows || [];
      if (!rows.length) { alert('No customer data to export.'); return; }
      var win = window.open('', '_blank');
      if (!win) { alert('Pop-up blocked. Please allow pop-ups and try again.'); return; }
      win.document.write('<html><head><title>Customers Report</title><style>body{font-family:Arial,sans-serif;padding:18px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:8px;font-size:12px;text-align:left}th{background:#f5f5f5}</style></head><body><h2>Customers Report</h2><table><tr><th>Name</th><th>Mobile</th><th>Visits</th><th>First Visit</th><th>Last Visit</th></tr>' +
        rows.map(function(r){ return '<tr><td>' + esc(r.name || '') + '</td><td>' + esc(r.mobile || '') + '</td><td>' + Number(r.bookingCount || 0) + '</td><td>' + (r.firstVisit ? new Date(r.firstVisit).toLocaleDateString() : '—') + '</td><td>' + (r.lastVisit ? new Date(r.lastVisit).toLocaleDateString() : '—') + '</td></tr>'; }).join('') +
        '</table></body></html>');
      win.document.close();
      win.onload = function() { win.print(); };
    }

    // ── Edit modal ───────────────────────────────────────────────
    var editingMobile = '';
    function openEditModal(btn) {
      editingMobile = btn.getAttribute('data-mobile');
      document.getElementById('editName').value = btn.getAttribute('data-name') || '';
      document.getElementById('editMobileDisplay').value = editingMobile;
      document.getElementById('editErr').style.display = 'none';
      document.getElementById('editErr').textContent = '';
      document.getElementById('editBackdrop').classList.add('open');
      setTimeout(function(){ document.getElementById('editName').focus(); }, 80);
    }
    function closeEditModal() {
      document.getElementById('editBackdrop').classList.remove('open');
      editingMobile = '';
    }
    async function saveEditCustomer() {
      var name = (document.getElementById('editName').value || '').trim();
      var errEl = document.getElementById('editErr');
      errEl.style.display = 'none';
      if (!name) {
        errEl.textContent = 'Name cannot be empty.';
        errEl.style.display = 'block';
        return;
      }
      try {
        await api(API + '/customers/' + encodeURIComponent(editingMobile), {
          method: 'PUT',
          body: JSON.stringify({ name: name })
        });
        closeEditModal();
        loadCustomers();
      } catch (e) {
        errEl.textContent = e.message || 'Failed to save.';
        errEl.style.display = 'block';
      }
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeEditModal();
    });
    document.getElementById('editBackdrop').addEventListener('click', function(e) {
      if (e.target === this) closeEditModal();
    });

    // ── Delete (double-tap confirm) ──────────────────────────────
    async function deleteCustomer(btn) {
      var mobile = btn.getAttribute('data-mobile');
      if (!deleteConfirming[mobile]) {
        // First tap
        deleteConfirming[mobile] = true;
        btn.textContent = 'Tap again to confirm';
        btn.classList.add('confirming');
        deleteTimers[mobile] = setTimeout(function() {
          delete deleteConfirming[mobile];
          btn.textContent = 'Delete';
          btn.classList.remove('confirming');
        }, 3000);
        return;
      }
      // Second tap — delete
      clearTimeout(deleteTimers[mobile]);
      delete deleteConfirming[mobile];
      btn.disabled = true;
      btn.textContent = 'Deleting…';
      try {
        await api(API + '/customers/' + encodeURIComponent(mobile), { method: 'DELETE' });
        loadCustomers();
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Delete';
        btn.classList.remove('confirming');
        var errEl = document.getElementById('err');
        errEl.textContent = e.message || 'Failed to delete.';
        errEl.style.display = 'block';
      }
    }
    function openSideMenu() {
      document.getElementById('sideMenu').classList.add('is-open');
      document.getElementById('sideMenuBackdrop').classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }
    function closeSideMenu() {
      document.getElementById('sideMenu').classList.remove('is-open');
      document.getElementById('sideMenuBackdrop').classList.remove('is-open');
      document.body.style.overflow = '';
    }
    document.getElementById('btnOpenSideMenu').addEventListener('click', openSideMenu);
    document.getElementById('sideMenuBackdrop').addEventListener('click', closeSideMenu);
    document.getElementById('sideMenu').addEventListener('click', function(ev) {
      var navTarget = ev.target.closest('a.nav-item, button.nav-item');
      if (!navTarget) return;
      if (navTarget.id === 'sideMenuLogout') { closeSideMenu(); portalLogout(); return; }
      closeSideMenu();
    });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeSideMenu(); });
    async function boot() {
      var t = localStorage.getItem('aakritiPortalToken');
      if (!t) {
        window.location.href = localStorage.getItem('aakritiPortalReturnLogin') || '/aakriti/login';
        return;
      }
      var r = await fetch(API + '/me', { headers: authHeaders() });
      var j = await r.json().catch(function(){ return {}; });
      if (!r.ok || j.status !== 'success') { portalLogout(); return; }
      currentRole = j.data.role || 'staff';
      applyRoleUI(j.data.role);
      var su = document.getElementById('sidebarUser');
      if (su) su.textContent = j.data.username || (j.data.role === 'admin' ? 'Admin' : 'Staff');
      await loadCustomers();
      var cs = document.getElementById('customerSearch');
      if (cs) {
        cs.addEventListener('keydown', function(ev) {
          if (ev.key === 'Enter') {
            ev.preventDefault();
            loadCustomers();
          }
        });
      }
    }
    boot();
  </script>
</body>
</html>
